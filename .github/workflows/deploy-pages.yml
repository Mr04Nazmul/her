name: Deploy Her to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/*.test.mjs
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Wait for GitHub's branch-based Pages build
        uses: actions/github-script@v7
        with:
          script: |
            for (let attempt = 0; attempt < 60; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                ...context.repo, head_sha: context.sha, per_page: 100
              });
              const branchBuilds = data.workflow_runs.filter(run =>
                run.id !== context.runId &&
                run.path === 'dynamic/pages/pages-build-deployment'
              );
              if (branchBuilds.every(run => run.status === 'completed')) return;
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw new Error('Branch-based Pages build did not finish in time.');
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
